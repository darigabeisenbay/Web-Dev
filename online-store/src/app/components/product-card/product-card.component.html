<div class="product-card">
  <div class="image-box">
    <img [src]="product.image" [alt]="product.name">
  </div>

  <div class="product-info">
    <h3>{{ product.name }}</h3>
    <p class="description">{{ product.description }}</p>
    
    <div class="meta">
      <span class="price">{{ product.price | number }} ₸</span>
      <span class="rating">⭐ {{ product.rating }}</span>
    </div>

    <div class="actions">
      <a [href]="product.link" target="_blank" class="kaspi-btn">Купить на Kaspi</a>
      <div class="share-btns">
        <button (click)="shareWhatsApp()" class="btn-wa">WA</button>
        <button (click)="shareTelegram()" class="btn-tg">TG</button>
      </div>
    </div>
  </div>
</div>
